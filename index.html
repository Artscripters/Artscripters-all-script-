<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Scripters Vault</title>
<script>if(location.hash==='#admin')document.documentElement.classList.add('admin');</script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="topbar"><span class="logo">ART<b>SCRIPTERS</b></span></div>
<div class="wrap">
  <header class="hero">
    <h1>ART SCRIPTERS VAULT</h1>
    <div class="sub">Free scripts, ready to copy. Fresh drops all the time.</div>
  </header>  <a href="https://artscriptvault.netlify.app" style="display:block;text-align:center;margin:16px 0 0;padding:14px;border-radius:14px;font-weight:700;text-decoration:none;color:#04101f;background:linear-gradient(90deg,#facc15,#fb923c)">📂 More scripts (old Vault)</a>

  <div id="adminBar" class="admin-bar">
    <strong>Admin mode</strong>
    <div class="row" style="margin-top:8px">
      <button id="addBtn">+ Add text box</button>
      <button id="saveBtn" class="ghost">Save all</button>
    </div>
    <div id="status" class="msg"></div>
  </div>

  <div class="search"><input id="q" type="search" placeholder="Search scripts..." autocomplete="off"></div>
  <div class="section-title"><i></i>Latest Scripts</div>
  <div id="list"></div>
  <div id="nores" class="nores">No scripts found.</div>
</div>

<nav class="bottomnav">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})">🏠<span>Home</span></button>
  <button onclick="document.getElementById('list').scrollIntoView({behavior:'smooth'})">📜<span>Scripts</span></button>
  <button onclick="var q=document.getElementById('q');q.scrollIntoView({behavior:'smooth',block:'center'});q.focus()">🔍<span>Search</span></button>
</nav>

<script src="app.js"></script>
<script src="gate.js"></script>
<script src="search.js"></script>
</body>
</html>
