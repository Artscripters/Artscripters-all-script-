<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art Scripters Vault</title>
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --text:#e8eaf0; --muted:#8b90a0; --accent:#6c8cff; --danger:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:720px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 4px; }
  .sub { color:var(--muted); font-size:.9rem; margin-bottom:16px; }
  .box { background:var(--card); border-radius:12px; padding:14px; margin-bottom:12px; }
  .box h2 { font-size:1rem; margin:0 0 8px; }
  .box pre { white-space:pre-wrap; word-break:break-word; margin:0 0 10px; font-family:ui-monospace,monospace; font-size:.85rem; background:#12141c; padding:10px; border-radius:8px; max-height:260px; overflow:auto; }
  .thumb { display:block; width:100%; max-height:200px; object-fit:cover; border-radius:8px; margin-bottom:10px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font-size:.95rem; cursor:pointer; }
  button.ghost { background:#2a2e3d; }
  button.danger { background:var(--danger); }
  input, textarea { width:100%; background:#12141c; color:var(--text); border:1px solid #2a2e3d; border-radius:8px; padding:10px; font-size:1rem; margin-bottom:8px; font-family:inherit; }
  textarea { min-height:120px; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .admin-bar { background:#23283a; border-radius:12px; padding:12px; margin-bottom:16px; display:none; }
  .msg { color:var(--muted); font-size:.85rem; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Art Scripters Vault</h1>
  <div class="sub">Get the script you need below.</div>

  <div id="adminBar" class="admin-bar">
    <strong>Admin mode</strong>
    <div class="row" style="margin-top:8px">
      <button id="addBtn">+ Add text box</button>
      <button id="saveBtn" class="ghost">Save all</button>
    </div>
    <div id="status" class="msg"></div>
  </div>

  <div id="list"></div>
</div>
<script src="app.js"></script>
<script src="gate.js"></script></body>
</html>
