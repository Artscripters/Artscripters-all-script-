<!doctype html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Lilita+One&display=swap" rel="stylesheet">

</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="kicker">ART SCRIPTERS</div>

  <div class="section-title"><i></i>Scripts</div>

<div id="list"></div>

</div>
